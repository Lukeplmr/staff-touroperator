
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Candidati VU</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 0;
      background-color: #D5B893;  /* SFONDO */
      }

    a {
      color: inherit; 
      text-decoration: none;
    }

    h2, h3 , h6{
      text-align: center;
    }
    
    h2 {
      margin: 0;
    }

    h6 {
      margin: 0;
      font-size: 0.8rem;
      color: #333;
    }

    .card {
      max-width: 800px;
      margin: 2rem auto;
      display: flex;
      background-color: #78898F;    /* UGUALE A LEFT */
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .left {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      width: 100%;
      background-color: #78898F;    /* SOPRA */
    }

    .left img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin-bottom: 1rem;
      object-fit: cover;
    }

    .left p {
      margin-bottom: 0.2rem;
      text-align: center;
    }
    
    .right {
      flex: 2;
      padding: 0rem 1rem 1rem 1rem;
      background-color: #8D957E;     /* SOTTO */
      border-radius: 10px;
    }
      
    .right .description {
      font-size: 0.9rem;
      text-align: center;
      color: #090909;
      font-family: 'Courier New', monospace;
    }



.right ul {
  padding-left: 1.2rem;
  margin-top: 0.2rem;
  margin-bottom: 0.8rem;
}

.right li {
  list-style-type: disc;
  margin-bottom: 0.5rem;
}



.title {
  margin-bottom: 1rem;
}


.badge {
  position: absolute;
  top: 10px;
  left: 10px;
  background-color: #984216;      /* BADGE */
  color: #FAFAFA;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 1rem;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
    
    .info-flex {
      display: flex;
      gap: 1.5rem;
      justify-content: space-between;
      flex-wrap: wrap; /* per mobile */
    }

    .lingue-colonna,
    .info-colonna {
      flex: 1;
      min-width: 100px; /* per evitare che si accavallino su schermi piccoli */
    }


@media screen and (max-width: 600px) {
  body {
    overflow: hidden;
    font-size: 14px;
    line-height: 1.0;
  }

  .scroll-container {
    margin-top: 2.5vh;
    margin-left: 2.5vh;
    margin-right: 2.5vh;
    margin-bottom: 2.5vh;
    height: 100vh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
  }

  .card {
    scroll-snap-align: start;
    height: auto;
    height: 90vh;
    width: 100%;
    box-sizing: border-box;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    margin-top: 5vh;
    margin-bottom: 10vh;
  }

  .right .description {
    font-size: 0.7rem;
    line-height: 0.9rem;
  }


  .badge {
    top: 10px;
    left: 25px;
  }

  
}

  </style>
</head>
<body>
  <div class="scroll-container" id="container"></div>

  <script>
    fetch('candidati.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('container');
        container.innerHTML = '';

        data.forEach(candidato => {
          const card = document.createElement('div');
          const lingueHTML = candidato.lingue?.length
            ? `<div class="lingue-colonna">
                 <p><strong>Lingue conosciute:</strong></p>
                 <ul>${candidato.lingue.map(lingua => `<li>${lingua}</li>`).join('')}</ul>
               </div>`
            : '';


          card.className = 'card';

          card.innerHTML = `

            <div class="left" style="position: relative;">
              <div class="badge">${candidato.id}</div>
              <img src="${candidato.foto}" alt="Foto di ${candidato.nome} ${candidato.cognome}">
              <div class="title">
              <h2>${candidato.nome} ${candidato.cognome}</h2>
              <h6><a href="https://instagram.com/${candidato.instagram}" target="_blank">@${candidato.instagram}</a></h6>
              </div>
              <p><strong>Data di nascita:</strong> ${candidato.compleanno} ,  (<i>${candidato.età}</i> anni)</p>
              <p><strong>Città:</strong> ${candidato.città}</p>
              <p><strong>Voto:</strong> ${candidato.voto}</p>
            </div>

            <div class="right">
              <div class="descriptions">
              <h3> Descrizione </h3>
              <div class="description"><strong>${candidato.descrizione}</strong></div>
              </div>

              <div class="info">
                <h3>Informazioni Utili</h3>
                <div class="info-flex">
                  ${lingueHTML}
                  <div class="info-colonna">
                    <p><strong>Patente: </strong><i>${candidato.patente}</i></p>
                    <p><strong>Guida il motorino: </strong><i>${candidato.motorino}</i></p>
                  </div>
                </div>
              </div>




              
            </div>
          `;

          container.appendChild(card);
        });
      });
  </script>
</body>
</html>
