
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Candidato Animatore</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    .card {
      max-width: 800px;
      margin: 2rem auto;
      display: flex;
      background: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .left {
      flex: 1;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #fafafa;
    }

    .left img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
    }

    .left .description {
      font-size: 0.9rem;
      text-align: center;
      color: #555;
    }

    .right {
      flex: 2;
      padding: 1rem;
    }

    .right h2 {
      margin-top: 0;
      margin-bottom: 0.5rem;
    }

    .right p {
      margin: 0.3rem 0;
    }

    @media screen and (max-width: 600px) {
      body {
        overflow: hidden;
      }

      .scroll-container {
        height: 100vh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        -webkit-overflow-scrolling: touch;
      }

      .card {
        scroll-snap-align: start;
        height: 100vh;
        width: 100%;
        box-sizing: border-box;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .left, .right {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="scroll-container" id="container"></div>

  <script>
    fetch('candidati.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('container');
        container.innerHTML = '';

        data.forEach(candidato => {
          const card = document.createElement('div');
          card.className = 'card';

          card.innerHTML = `
            <div class="left">
              <img src="\${candidato.foto}" alt="Foto di \${candidato.nome} \${candidato.cognome}">
              <div class="description">\${candidato.descrizione}</div>
            </div>
            <div class="right">
              <h2>\${candidato.nome} \${candidato.cognome}</h2>
              <p><strong>Anno di nascita:</strong> \${candidato.anno_nascita}</p>
              <p><strong>Età:</strong> \${candidato.eta}</p>
              <p><strong>Instagram:</strong> <a href="https://instagram.com/\${candidato.instagram}" target="_blank">@\${candidato.instagram}</a></p>
              <p><strong>Città:</strong> \${candidato.città}</p>
              <p><strong>Voto:</strong> \${candidato.voto}</p>
            </div>
          `;

          container.appendChild(card);
        });
      });
  </script>
</body>
</html>
