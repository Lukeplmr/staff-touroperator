
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Candidato Animatore</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: 'Georgia', serif
      margin: 0;
      padding: 0;
      background-color: #E4D6C5;
    }

    a {
      color: inherit; /* usa il colore del testo circostante */
      text-decoration: none; /* rimuove la sottolineatura */
    }


    .card {
      max-width: 800px;
      margin: 2rem auto;
      display: flex;
      background: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .left {
      flex: 1;
      padding: 1rem;
      display: flex;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #78898F;
    }

    .left img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
    }

    .right .description {
      font-size: 0.9rem;
      text-align: center;
      color: #555;
    }

    .right {
      flex: 2;
      padding: 1rem;
      background-color: #8D957E;

    }

    .left h2 {
      margin-top: 0;
      margin-bottom: 0.5rem;
    }

    .left p {
      margin: 0.3rem 0;
    }

     .badge {
        position: absolute;
        top: 10px;
        left: 10px;
        background-color: #984216;
        color: white;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1rem;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    @media screen and (max-width: 600px) {
      body {
        overflow: hidden;
      }

      .scroll-container {
        height: 90vh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        -webkit-overflow-scrolling: touch;
      }

      .card {
        scroll-snap-align: start;
        height: 90vh;
        width: 100%;
        box-sizing: border-box;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin-top: 10vh;
      }

      .badge {
        top: 7,5px;
        left: 25px;
      }
      

    }
  </style>
</head>
<body>
  <div class="scroll-container" id="container"></div>

  <script>
    fetch('candidati.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('container');
        container.innerHTML = '';

        data.forEach(candidato => {
          const card = document.createElement('div');
          const lingueHTML = candidato.lingue?.length
          ? `<p><strong>Lingue conosciute:</strong>
            <ul>${candidato.lingue.map(lingua => `<li>${lingua}</li>`).join('')}</ul>
             </p>`
          : '';

          card.className = 'card';

          card.innerHTML = `

            <div class="left" style="position: relative;">
              <div class="badge">${candidato.id}</div>
              <img src="${candidato.foto}" alt="Foto di ${candidato.nome} ${candidato.cognome}">
              <h2>${candidato.nome} ${candidato.cognome}</h2>
              <p><strong>Giorno di nascita:</strong> ${candidato.compleanno}</p>
              <p><strong>Età:</strong> ${candidato.età}</p>
              <p><strong>Città:</strong> ${candidato.città}</p>
              <p><strong>Instagram:</strong> <a href="https://instagram.com/${candidato.instagram}" target="_blank">@${candidato.instagram}</a></p>
              <p><strong>Voto:</strong> ${candidato.voto}</p>
            </div>

            <div class="right">
              <h3> Inormazioni </h3>
              ${lingueHTML}
              <p><strong>Ha la patente:</strong> ${candidato.patente}</p>
              <p><strong>Guida il motorino:</strong> ${candidato.motorino}</p>


              <h3> Descrizione </h3>
              <div class="description">${candidato.descrizione}</div>
            </div>
          `;

          container.appendChild(card);
        });
      });
  </script>
</body>
</html>
